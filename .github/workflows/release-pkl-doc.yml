# Any changes should be made to the template, not this file.

name: Release-Pkl-Doc
'on':
  push:
    branches:
    - main
permissions:
  contents: read
jobs:
  generate-pkl-doc:
    name: Generate Pkl Doc
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Install just
      uses: taiki-e/install-action@v2
      with:
        tool: just
    - name: Generate pkl doc
      shell: bash
      run: just make-internalpkldoc
    - name: Upload artifact for GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: build/pkldoc/makeInternalPklDoc
  deploy-doc-to-pages:
    name: Deploy Pkl Doc to GitHub Pages
    needs:
    - generate-pkl-doc
    permissions:
      id-token: write
      pages: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: gh-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
